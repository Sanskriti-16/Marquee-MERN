<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Animation</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(to bottom,#87CEEB,#4CAF50);
        overflow:hidden;
    }

    .ground{
        position:absolute;
        bottom:0;
        width:100%;
        height:180px;
        background:#2E8B57;
    }

    .ball{
        width:120px;
        height:120px;
        position:absolute;
        bottom:180px;

        /* Animation */
        animation: footballMove 6s ease-in-out infinite;
    }

    .ball img{
        width:100%;
        height:100%;
        object-fit:contain;
    }

    @keyframes footballMove{

        0%{
            transform:translateX(-500px)
                     translateY(0)
                     rotate(0deg)
                     scale(1);
        }

        20%{
            transform:translateX(-250px)
                     translateY(-80px)
                     rotate(180deg)
                     scale(1.2);
        }

        40%{
            transform:translateX(0px)
                     translateY(-140px)
                     rotate(360deg)
                     scale(1.4);
        }

        60%{
            transform:translateX(250px)
                     translateY(-80px)
                     rotate(540deg)
                     scale(1.2);
        }

        80%{
            transform:translateX(500px)
                     translateY(0)
                     rotate(720deg)
                     scale(1);
        }

        100%{
            transform:translateX(-500px)
                     translateY(0)
                     rotate(1080deg)
                     scale(1);
        }
    }

</style>

</head>
