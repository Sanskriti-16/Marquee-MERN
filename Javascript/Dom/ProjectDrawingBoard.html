<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drawing Board</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #c7d3c0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px;
      gap: 20px;
    }

    #drawing-board {
      width: 75vw;
      height: 75vh;
      background: #e8f5e9;
      border: 2px solid gray;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
    }

    .drawing {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .controls {
      width: 75vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 15px 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #ef5350;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #d32f2f;
    }

    input[type="range"] {
      width: 180px;
      cursor: pointer;
    }

    input[type="color"] {
      width: 40px;
      height: 40px;
      border: none;
      cursor: pointer;
      background: none;
    }
  </style>
</head>

<body>

  <div id="drawing-board"></div>

  <div class="controls">

    <button id="clear-board">Clear</button>

    <div class="control-group">
      <strong>Brush Size</strong>
      <input type="range" id="slider" min="2" max="50" value="10">
    </div>

    <div class="control-group">
      <strong>Color</strong>
      <input type="color" id="colorPicker" value="#ff0000">
    </div>

  </div>

<script>

const board = document.getElementById("drawing-board");
const slider = document.getElementById("slider");
const colorPicker = document.getElementById("colorPicker");
const clearBtn = document.getElementById("clear-board");

let drawing = false;

let brushSize = slider.value;
let brushColor = colorPicker.value;

slider.addEventListener("input", function () {
    brushSize = this.value;
});

colorPicker.addEventListener("input", function () {
    brushColor = this.value;
});
board.addEventListener("mousedown", function (e) {
    drawing = true;
    createDot(e);
});
document.addEventListener("mouseup", function () {
    drawing = false;
});
board.addEventListener("mousemove", function (e) {
    if (drawing) {
        createDot(e);
    }
});

function createDot(e) {

    const rect = board.getBoundingClientRect();

    const dot = document.createElement("div");

    dot.classList.add("drawing");

    dot.style.width = brushSize + "px";
    dot.style.height = brushSize + "px";

    dot.style.background = brushColor;

    dot.style.left = (e.clientX - rect.left - brushSize / 2) + "px";
    dot.style.top = (e.clientY - rect.top - brushSize / 2) + "px";

    board.appendChild(dot);
}
clearBtn.addEventListener("click", function () {
    board.innerHTML = "";
});

</script>

</body>
</html>
